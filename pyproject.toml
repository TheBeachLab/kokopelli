[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kokopelli-reloaded"
version = "0.3.0"
description = "Script-based CAD/CAM using Python as a hardware description language"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "Francisco Sanchez" }]
dependencies = [
    "numpy>=1.23",
    "pillow>=9",
    "pyopengl>=3.1.6",
    "wxpython>=4.2",
]

[project.scripts]
kokopelli = "koko.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["koko"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9"]
